{% raw %}
<!-- Teaching Quality Assessment Pipeline Diagram -->
<!-- Usage: {% include pipeline-diagram.html %} in any post or layout -->
<!-- Place this file in your Jekyll _includes/ directory -->

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
  .tqa-pipeline *, .tqa-pipeline *::before, .tqa-pipeline *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .tqa-pipeline {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
    font-family: 'DM Sans', sans-serif;
  }

  .tqa-canvas {
    background: #111320;
    border-radius: 20px;
    padding: 36px 28px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    width: 100%;
    overflow-x: auto;
  }

  .tqa-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 32px;
    text-align: center;
  }

  .tqa-row {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 640px;
  }

  .tqa-node {
    flex-shrink: 0;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 10px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: default;
    animation: tqaFadeUp 0.5s ease both;
  }
  .tqa-node:hover { transform: translateY(-3px); }

  .tqa-node .tqa-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    text-align: center;
    line-height: 1.35;
    margin-top: 8px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.01em;
  }

  .tqa-node-audio {
    background: linear-gradient(135deg, #1a1d30 0%, #171929 100%);
    border: 1px solid rgba(120,130,255,0.2);
    box-shadow: 0 0 24px rgba(100,110,255,0.08);
    width: 84px;
    padding: 16px 10px;
  }
  .tqa-node-audio:hover { box-shadow: 0 8px 32px rgba(100,110,255,0.18); }

  .tqa-fork-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  .tqa-node-asr {
    background: linear-gradient(135deg, #0e4a4a 0%, #0a3535 100%);
    border: 1px solid rgba(0,210,180,0.25);
    box-shadow: 0 0 16px rgba(0,210,180,0.06);
    width: 112px;
  }
  .tqa-node-asr:hover { box-shadow: 0 8px 24px rgba(0,210,180,0.2); }
  .tqa-node-asr .tqa-label { color: #7dffd6; }

  .tqa-node-diarize {
    background: linear-gradient(135deg, #3d2a0a 0%, #2d1f07 100%);
    border: 1px solid rgba(255,165,0,0.25);
    box-shadow: 0 0 16px rgba(255,165,0,0.06);
    width: 112px;
  }
  .tqa-node-diarize:hover { box-shadow: 0 8px 24px rgba(255,165,0,0.2); }
  .tqa-node-diarize .tqa-label { color: #ffc96b; }

  .tqa-node-fusion {
    background: linear-gradient(135deg, #2d1a4a 0%, #1f1235 100%);
    border: 1px solid rgba(180,100,255,0.3);
    box-shadow: 0 0 24px rgba(160,80,255,0.1);
    width: 88px;
    height: 94px;
  }
  .tqa-node-fusion:hover { box-shadow: 0 8px 32px rgba(160,80,255,0.25); }
  .tqa-node-fusion .tqa-label { color: #cc9fff; }

  .tqa-node-transcript {
    background: linear-gradient(135deg, #1a1e30 0%, #141726 100%);
    border: 1.5px dashed rgba(255,255,255,0.12);
    width: 112px;
    height: 94px;
  }
  .tqa-node-transcript:hover { border-color: rgba(255,255,255,0.25); }

  .tqa-node-llm {
    background: linear-gradient(135deg, #1a3020 0%, #122018 100%);
    border: 1px solid rgba(80,200,100,0.3);
    box-shadow: 0 0 24px rgba(80,200,100,0.08);
    width: 100px;
    height: 94px;
  }
  .tqa-node-llm:hover { box-shadow: 0 8px 32px rgba(80,200,100,0.22); }
  .tqa-node-llm .tqa-label { color: #88f0a0; }

  .tqa-node-output {
    background: linear-gradient(135deg, #2a1a20 0%, #1e1218 100%);
    border: 1px solid rgba(255,100,120,0.25);
    box-shadow: 0 0 24px rgba(255,100,120,0.07);
    width: 84px;
    padding: 16px 10px;
  }
  .tqa-node-output:hover { box-shadow: 0 8px 32px rgba(255,100,120,0.2); }
  .tqa-node-output .tqa-label { color: #ffaab8; }

  .tqa-arrow {
    flex-shrink: 0;
    width: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Waveform */
  .tqa-waveform { display: flex; gap: 2px; align-items: center; height: 30px; }
  .tqa-wave-bar {
    width: 3px;
    border-radius: 2px;
    background: linear-gradient(to top, #6a7fff, #a78bfa);
    animation: tqaWave 1.5s ease-in-out infinite;
  }
  .tqa-wave-bar:nth-child(1) { height: 12px; animation-delay: 0s; }
  .tqa-wave-bar:nth-child(2) { height: 18px; animation-delay: 0.1s; }
  .tqa-wave-bar:nth-child(3) { height: 24px; animation-delay: 0.2s; }
  .tqa-wave-bar:nth-child(4) { height: 15px; animation-delay: 0.3s; }
  .tqa-wave-bar:nth-child(5) { height: 20px; animation-delay: 0.4s; }
  .tqa-wave-bar:nth-child(6) { height: 12px; animation-delay: 0.5s; }
  .tqa-wave-bar:nth-child(7) { height: 17px; animation-delay: 0.15s; }
  @keyframes tqaWave {
    0%, 100% { transform: scaleY(1); opacity: 0.6; }
    50% { transform: scaleY(1.4); opacity: 1; }
  }

  /* ASR doc lines */
  .tqa-doc-icon { display: flex; flex-direction: column; gap: 4px; }
  .tqa-doc-line { height: 3px; border-radius: 2px; background: rgba(125,255,214,0.4); }

  /* Diarize "who talked when" text */
  .tqa-wtw {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-style: italic;
    color: rgba(255,185,80,0.6);
    letter-spacing: 0.02em;
    text-align: center;
    line-height: 1.4;
  }

  /* Fusion icon */
  .tqa-merge-icon { font-size: 22px; filter: drop-shadow(0 0 8px rgba(180,100,255,0.4)); }

  /* Score star */
  .tqa-score-star { font-size: 24px; line-height: 1; filter: drop-shadow(0 0 8px rgba(255,160,180,0.5)); }

  /* Transcript lines */
  .tqa-transcript-lines { display: flex; flex-direction: column; gap: 4px; padding: 2px 0; }
  .tqa-t-line { height: 3px; border-radius: 2px; }
  .tqa-t-line.blue   { background: rgba(80,160,255,0.55); }
  .tqa-t-line.orange { background: rgba(255,165,60,0.55); }

  /* LLM chip icon — contained grid, no overflow */
  .tqa-chip {
    width: 32px;
    height: 32px;
    border: 2px solid rgba(136,240,160,0.35);
    border-radius: 6px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 2px;
    padding: 4px;
    flex-shrink: 0;
  }
  .tqa-chip-cell {
    border-radius: 2px;
    background: rgba(136,240,160,0.25);
    animation: tqaChip 2s ease-in-out infinite;
  }
  .tqa-chip-cell:nth-child(1) { animation-delay: 0s; }
  .tqa-chip-cell:nth-child(2) { animation-delay: 0.3s; }
  .tqa-chip-cell:nth-child(3) { animation-delay: 0.6s; }
  .tqa-chip-cell:nth-child(4) { animation-delay: 0.9s; }
  .tqa-chip-cell:nth-child(5) { animation-delay: 0.15s; background: rgba(136,240,160,0.5); }
  .tqa-chip-cell:nth-child(6) { animation-delay: 0.45s; }
  .tqa-chip-cell:nth-child(7) { animation-delay: 0.75s; }
  .tqa-chip-cell:nth-child(8) { animation-delay: 1.05s; }
  .tqa-chip-cell:nth-child(9) { animation-delay: 0.6s; }
  @keyframes tqaChip {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* Badges */
  .tqa-badge {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 20px;
    margin-top: 6px;
  }
  .tqa-badge-blue   { background: rgba(80,160,255,0.12); color: #80c0ff; }
  .tqa-badge-orange { background: rgba(255,165,60,0.12);  color: #ffba70; }

  @keyframes tqaFadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="tqa-pipeline">
  <div class="tqa-canvas">
    <div class="tqa-title">Automated Teaching Quality Assessment Pipeline</div>

    <div class="tqa-row">

      <!-- RAW AUDIO -->
      <div class="tqa-node tqa-node-audio" style="animation-delay:0.05s">
        <div class="tqa-waveform">
          <div class="tqa-wave-bar"></div><div class="tqa-wave-bar"></div>
          <div class="tqa-wave-bar"></div><div class="tqa-wave-bar"></div>
          <div class="tqa-wave-bar"></div><div class="tqa-wave-bar"></div>
          <div class="tqa-wave-bar"></div>
        </div>
        <div class="tqa-label">Raw Audio<br>Signal</div>
      </div>

      <!-- SPLIT CONNECTOR -->
      <div style="position:relative; width:44px; align-self:stretch; flex-shrink:0;">
        <svg viewBox="0 0 44 120" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100%;height:100%;">
          <circle cx="8" cy="60" r="2.5" fill="rgba(255,255,255,0.2)"/>
          <path d="M8,60 C26,60 18,28 40,28"  stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
          <path d="M8,60 C26,60 18,92 40,92"  stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
        </svg>
      </div>

      <!-- ASR + DIARIZE FORK -->
      <div class="tqa-fork-section">
        <div class="tqa-node tqa-node-asr" style="animation-delay:0.15s;">
          <div class="tqa-doc-icon">
            <div class="tqa-doc-line" style="width:32px"></div>
            <div class="tqa-doc-line" style="width:22px"></div>
            <div class="tqa-doc-line" style="width:28px"></div>
          </div>
          <div class="tqa-label">Automatic Speech<br>Recognition</div>
        </div>
        <div class="tqa-node tqa-node-diarize" style="animation-delay:0.2s;">
          <div class="tqa-wtw">who talked<br>when</div>
          <div class="tqa-label">Speaker<br>Diarization</div>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <span class="tqa-badge tqa-badge-blue">Student</span>
            <span class="tqa-badge tqa-badge-orange">Teacher</span>
          </div>
        </div>
      </div>

      <!-- MERGE CONNECTOR -->
      <div style="position:relative; width:44px; align-self:stretch; flex-shrink:0;">
        <svg viewBox="0 0 44 120" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100%;height:100%;">
          <path d="M4,28  C26,28  18,60 36,60" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
          <path d="M4,92  C26,92  18,60 36,60" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
          <circle cx="36" cy="60" r="2.5" fill="rgba(255,255,255,0.2)"/>
        </svg>
      </div>

      <!-- FUSION -->
      <div class="tqa-node tqa-node-fusion" style="animation-delay:0.25s;">
        <div class="tqa-merge-icon">⊕</div>
        <div class="tqa-label">Fusion</div>
      </div>

      <!-- ARROW -->
      <div class="tqa-arrow">
        <svg width="22" height="10" viewBox="0 0 22 10">
          <path d="M0 5 H16 M13 2 L20 5 L13 8" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- TRANSCRIPT -->
      <div class="tqa-node tqa-node-transcript" style="animation-delay:0.32s;">
        <div class="tqa-transcript-lines">
          <div class="tqa-t-line blue"   style="width:80px"></div>
          <div class="tqa-t-line orange" style="width:60px"></div>
          <div class="tqa-t-line blue"   style="width:74px"></div>
          <div class="tqa-t-line orange" style="width:84px"></div>
          <div class="tqa-t-line blue"   style="width:52px"></div>
          <div class="tqa-t-line orange" style="width:70px"></div>
        </div>
        <div style="display:flex; gap:6px; margin-top:6px;">
          <span class="tqa-badge tqa-badge-blue">Student</span>
          <span class="tqa-badge tqa-badge-orange">Teacher</span>
        </div>
      </div>

      <!-- ARROW -->
      <div class="tqa-arrow">
        <svg width="22" height="10" viewBox="0 0 22 10">
          <path d="M0 5 H16 M13 2 L20 5 L13 8" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- LLM -->
      <div class="tqa-node tqa-node-llm" style="animation-delay:0.4s;">
        <div class="tqa-chip">
          <div class="tqa-chip-cell"></div><div class="tqa-chip-cell"></div><div class="tqa-chip-cell"></div>
          <div class="tqa-chip-cell"></div><div class="tqa-chip-cell"></div><div class="tqa-chip-cell"></div>
          <div class="tqa-chip-cell"></div><div class="tqa-chip-cell"></div><div class="tqa-chip-cell"></div>
        </div>
        <div class="tqa-label">Large Language<br>Model (LLM)</div>
      </div>

      <!-- ARROW -->
      <div class="tqa-arrow">
        <svg width="22" height="10" viewBox="0 0 22 10">
          <path d="M0 5 H16 M13 2 L20 5 L13 8" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- OUTPUT -->
      <div class="tqa-node tqa-node-output" style="animation-delay:0.5s;">
        <div class="tqa-score-star">★</div>
        <div class="tqa-label">Teaching<br>Quality Scores</div>
      </div>

    </div>
  </div>
</div>
{% endraw %}
